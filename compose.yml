# ===========================================================================
# SoloDesk — Local development stack
# ===========================================================================
# This file is for LOCAL DEVELOPMENT ONLY. Deploys use `-f compose.deploy.yml`
# and never read this file.
#
# Networking: no `networks:` block anywhere. Every service lands on the
# project's implicit `default` network (`<project>_default`), so this stack is
# isolated from the staging/production stacks on the same host. Do NOT add a
# network with a hardcoded `name:` — that removes the project prefix, puts
# unrelated stacks on one bridge, and is what previously left `api` unable to
# resolve `postgres`.
#
# Host ports: only the developer-facing UIs are published, and all of them bind
# to 127.0.0.1 so nothing is reachable from outside this machine. Datastores
# (postgres, redis) publish nothing — reach them with
# `docker compose exec postgres psql -U solodesk` or add a temporary mapping.
#
# Configuration: every service reads `.env` when present via `env_file:`. Most
# vars (API keys, feature flags, ...) should stay as `${VAR:-fallback}` so a
# value set in `.env` applies to *all* services uniformly.
#
# Exception — DATABASE_URL/REDIS_URL/CELERY_BROKER_URL/CELERY_RESULT_BACKEND
# are hardcoded to the in-network hostnames (postgres/redis) on migrate, api,
# worker, beat. `.env` is shared with running the app natively on the host,
# where those same var names must point at `localhost` — and Compose loads
# root `.env` for `${VAR}` substitution too, so the host-facing value would
# silently win over the in-container default and every container would try
# to reach Postgres/Redis on its own loopback interface. `environment:`
# always overrides `env_file:` for the same key, so hardcoding here is safe.
# ===========================================================================

# Cap container logs so the shared host can't be filled by a dev stack.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solodesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solodesk}
      POSTGRES_DB: ${POSTGRES_DB:-solodesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solodesk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Redis
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Migrate + seed (one-shot).
  # Runs alembic upgrade head then seeds default data.
  # api and worker wait for this to complete successfully.
  # Idempotent — safe to run on every `docker compose up`.
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: .
      target: runtime
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://solodesk:solodesk@postgres:5432/solodesk
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
    command: python scripts/bootstrap.py
    logging: *default-logging

  # -------------------------------------------------------------------------
  # FastAPI app
  # -------------------------------------------------------------------------
  api:
    image: ${REGISTRY:-ghcr.io/solodeck/backend}/solodesk-backend:latest
    build:
      context: .
      target: runtime
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://solodesk:solodesk@postgres:5432/solodesk
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PORT: 8000
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./contracts:/app/contracts:ro
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
    command: >
      uvicorn src.main:app
        --host 0.0.0.0
        --port 8000
        --reload
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Celery worker
  # -------------------------------------------------------------------------
  worker:
    image: ${REGISTRY:-ghcr.io/solodeck/backend}/solodesk-backend-worker:latest
    build:
      context: .
      target: worker
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://solodesk:solodesk@postgres:5432/solodesk
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./contracts:/app/contracts:ro
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Celery beat (scheduler)
  # -------------------------------------------------------------------------
  beat:
    image: ${REGISTRY:-ghcr.io/solodeck/backend}/solodesk-backend-beat:latest
    build:
      context: .
      target: beat
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://solodesk:solodesk@postgres:5432/solodesk
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./contracts:/app/contracts:ro
    logging: *default-logging

  # -------------------------------------------------------------------------
  # MinIO — local S3-compatible object storage (for avatar/file uploads)
  # Console: http://127.0.0.1:9001  login: minioadmin / minioadmin
  #
  # Object storage S3-compatible cho file đính kèm (hợp đồng scan, biên nhận chuyển
  # khoản...). Trước đây frontend nhét cả nội dung file dạng base64 vào localStorage:
  # giới hạn ~5MB nên một cái PDF là vỡ, đổi máy là mất sạch, và file không bao giờ ra
  # khỏi trình duyệt nên không gửi được cho khách.
  #
  # .env.example vốn đã khai STORAGE_ENDPOINT/BUCKET/ACCESS_KEY — team định dùng S3 từ
  # đầu, chỉ chưa ai dựng. MinIO là S3 chạy local; khi deploy chỉ cần trỏ STORAGE_ENDPOINT
  # sang AWS S3 hay Cloudflare R2, không phải sửa code.  #Huynh
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web console
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Mailpit — local SMTP / email UI (http://127.0.0.1:8025)
  # -------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Test runner — uses dev image (includes pytest, httpx, etc.)
  # Usage: docker compose run --rm test
  #
  # The test DSNs are hardcoded on purpose — unlike every other service they
  # must NOT follow `.env`. A stray DATABASE_URL pointing at the dev database
  # would let the suite truncate real local data.
  # -------------------------------------------------------------------------
  test:
    build:
      context: .
      target: test
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://solodesk:solodesk@postgres:5432/solodesk_test
      TEST_DATABASE_URL: postgresql+asyncpg://solodesk:solodesk@postgres:5432/solodesk_test
      APP_ENV: development
      SECRET_KEY: test-secret-key-not-for-production
      JWT_SECRET_KEY: test-jwt-secret-key-not-for-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./contracts:/app/contracts:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    command: python -m pytest tests/ -v
    logging: *default-logging

  # -------------------------------------------------------------------------
  # pgAdmin — local PostgreSQL web UI
  # http://127.0.0.1:5050  login: admin@solodesk.dev / admin
  # Add server: host=postgres, port=5432, db=solodesk, user/pass=solodesk
  # -------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@solodesk.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging


volumes:
  postgres_data:
  minio_data:
